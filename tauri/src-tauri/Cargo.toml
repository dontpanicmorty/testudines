[package]
name = "sql-dojo"
version = "1.0.0"
description = "SQL Dojo — offline SQL practice"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[[bin]]
name = "sql-dojo"
path = "src/main.rs"
