[[card]]
id = "cd8adb75"
q = "Why does `main` take `argv=None` and return an `int`?"
a = "So tests can call `main([...])` directly and assert the returned exit code; only the `__main__` guard calls `sys.exit(main())`."

[[card]]
id = "b77b9f1f"
q = "Write the `__main__` guard for a script with `main()` returning an exit code."
a = "```python\nif __name__ == \"__main__\":\n    sys.exit(main())\n```"

[[card]]
id = "cbe58cba"
q = "What happens, and with what exit code, when argparse gets an invalid `choices` value?"
a = "It prints a usage error to stderr and raises `SystemExit(2)`."

[[card]]
id = "9259e6f9"
q = "What belongs on stdout and what on stderr?"
a = "stdout: the program's result data (pipeable). stderr: errors, warnings, progress and logs."

[[card]]
id = "e9807d68"
q = "Why is `parser.add_argument(\"--force\", type=bool)` a bug, and what is the fix?"
a = "`bool(\"False\")` is `True` (non-empty string). Use `action=\"store_true\"`."

[[card]]
id = "a1a5f8c8"
q = "What does `args.batch_size` come from, given `add_argument(\"--batch-size\", type=int, default=500)`?"
a = "argparse converts the dashes in `--batch-size` to underscores, giving an int attribute `batch_size` (500 by default)."

[[card]]
id = "655cfb0b"
q = "A job catches every exception and returns 0 after printing it. What goes wrong in production?"
a = "The scheduler sees success; failures are invisible. Return non-zero for failures (and catch only the expected errors)."
