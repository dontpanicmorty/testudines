[[card]]
id = "fc7f2852"
q = "Write the pandas for: `SELECT * FROM df WHERE amount > 20 AND status = 'paid'`."
a = '''```python
df[(df["amount"] > 20) & (df["status"] == "paid")]
```'''

[[card]]
id = "7ed6295d"
q = "Why does `df[df.a > 1 and df.b < 5]` raise 'truth value of a Series is ambiguous'?"
a = "`and` needs a single bool. Use `&` with parentheses around each comparison."

[[card]]
id = "2bbff63c"
q = "Write the pandas for `SELECT region, SUM(amount) AS total FROM df GROUP BY region` with `region` kept as a column."
a = '''```python
df.groupby("region", as_index=False).agg(total=("amount", "sum"))
```'''

[[card]]
