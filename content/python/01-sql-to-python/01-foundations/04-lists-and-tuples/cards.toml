[[card]]
id = "7f8c49da"
q = "What are `a` and `b`?\n```python\na = [1]; a.append([2, 3])\nb = [1]; b.extend([2, 3])\n```"
a = "`a == [1, [2, 3]]`, `b == [1, 2, 3]`."

[[card]]
id = "2ce44245"
q = "Why is `xs = xs.sort()` a bug?"
a = "`sort()` sorts in place and returns `None`, so `xs` becomes `None`. Use `xs.sort()` or `xs = sorted(xs)`."

[[card]]
id = "42fb02c4"
q = "Write the Python for `ORDER BY amount DESC` on `orders = [(\"o1\", 50), (\"o2\", 90)]`."
a = "```python\nsorted(orders, key=lambda o: o[1], reverse=True)\n```"

[[card]]
id = "e5cb5867"
q = "After `b = a; b.append(4)` with `a = [1, 2, 3]`, what is `a` and why?"
a = "`[1, 2, 3, 4]`. `b = a` makes a second name for the same list, not a copy. Use `a.copy()`."

[[card]]
id = "9db5d888"
q = "What do `first` and `rest` hold after `first, *rest = [1, 2, 3, 4]`?"
a = "`first == 1`, `rest == [2, 3, 4]`."

[[card]]
