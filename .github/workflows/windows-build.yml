name: Windows build

# Verifies tauri/build.ps1 actually works on real Windows, since it can't be tested locally
# (no Windows machine/VM in the author's dev environment). Runs on pushes/PRs that touch the
# Tauri app, plus manual dispatch for on-demand checks.
on:
  push:
    branches: [main]
    paths:
      - "tauri/**"
      - ".github/workflows/windows-build.yml"
  pull_request:
    paths:
      - "tauri/**"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Pre-installs Rust via the official action instead of relying on build.ps1's own
      # install-on-demand path, so this job verifies the *build*, not the installer prompt
      # (which is interactive and meant for a human at a terminal, not CI).
      - uses: dtolnay/rust-toolchain@stable

      - name: Run build.ps1
        shell: pwsh
        run: ./tauri/build.ps1

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: sql-dojo-windows-msi
          path: tauri/src-tauri/target/release/bundle/msi/*.msi
