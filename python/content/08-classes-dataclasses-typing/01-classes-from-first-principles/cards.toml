[[card]]
id = "f64db301"
q = "What is `self` in a method?"
a = "The instance the method is being called on. `obj.m(x)` is `Class.m(obj, x)`; Python passes `obj` as `self` automatically."

[[card]]
id = "e3da8f21"
q = "Inside `__init__` you write `count = 0` instead of `self.count = 0`. What goes wrong?"
a = "`count` is just a local variable that vanishes; the instance never gets the attribute, so later `self.count` raises `AttributeError`."

[[card]]
id = "bbf63963"
q = "```python\nclass Job:\n    errors = []\na, b = Job(), Job()\na.errors.append(\"x\")\nprint(len(b.errors))\n```\nWhat prints and how do you fix the class?"
a = "`1`: the list is a class attribute shared by all instances. Create it per instance with `self.errors = []` in `__init__`."

[[card]]
id = "54c8b5bf"
q = "Write a `__repr__` for `Watermark` (attribute `value`) that prints like `Watermark('2025-01-05')`."
a = "```python\ndef __repr__(self):\n    return f\"Watermark({self.value!r})\"\n```"

[[card]]
id = "38402402"
q = "What does `@property` change for the caller?"
a = "The method is read like an attribute (`s.reject_rate`, no parentheses) but is computed each time it is accessed."

[[card]]
id = "76626d17"
q = "Name two situations where you should NOT write a class."
a = "When there's no state to remember (use a function), or when you only bundle fields (use a dataclass or dict)."

[[card]]
id = "68ba3507"
q = "Why does printing an object with no `__repr__` show `<__main__.Plain object at 0x...>`?"
a = "That's the default `object.__repr__`: type name plus memory address. Define `__repr__` for something readable."
