[[card]]
id = "61caaa67"
q = "Rewrite as a chained comparison: `age >= 18 and age < 65`"
a = "`18 <= age < 65`"

[[card]]
id = "3368f8e6"
q = "What does this print and why?\n```python\nx = 120\nif x >= 20:\n    print(\"medium\")\nelif x >= 100:\n    print(\"large\")\n```"
a = "`medium`. Branches are tried top to bottom and the first true one wins, so the `elif` is unreachable."

[[card]]
id = "afc114e4"
q = "Why is `if status == \"paid\" or \"refunded\":` always true, and what is the fix?"
a = "The bare string `\"refunded\"` is truthy. Write `status in (\"paid\", \"refunded\")`."

[[card]]
id = "76266dca"
q = "`discount = 0`. What is the difference between `if not discount` and `if discount is None`?"
a = "`not discount` is True for `0` (and `\"\"`, `[]`, `None`). `is None` is True only for `None`. Use `is None` when zero is a real value."

[[card]]
id = "df4de9b3"
q = "Write a one-line conditional expression: `\"sold out\"` when `qty == 0`, otherwise `\"in stock\"`."
a = "```python\nlabel = \"sold out\" if qty == 0 else \"in stock\"\n```"

[[card]]
id = "cee44621"
q = "What does `\"email\" in row and row[\"email\"].endswith(\".com\")` do when `row = {}`?"
a = "It returns `False` without error: `and` short-circuits, so the second part is never evaluated."

[[card]]
id = "e3170fc3"
q = "What is the Python version of SQL `x NOT IN ('a', 'b')`?"
a = "`x not in (\"a\", \"b\")`"
