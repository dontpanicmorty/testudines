[[card]]
id = "20c53fd1"
q = "What is the difference between `row[\"plan\"]` and `row.get(\"plan\")` when the key is missing?"
a = "`row[\"plan\"]` raises `KeyError: 'plan'`; `row.get(\"plan\")` returns `None` (or your default)."

[[card]]
id = "8d450bbc"
q = "`row = {\"plan\": None}`. What does `row.get(\"plan\", \"free\")` return?"
a = "`None`. The default only applies when the key is missing, not when its value is `None`."

[[card]]
id = "052a8839"
q = "Write the one-line safe lookup of `event[\"device\"][\"os\"]` with default `\"unknown\"` when either level may be missing."
a = "```python\nevent.get(\"device\", {}).get(\"os\", \"unknown\")\n```"

[[card]]
