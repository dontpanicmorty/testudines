q = "What is `{**{\"a\": 1, \"b\": 2}, **{\"b\": 9}}`?"
a = "`{'a': 1, 'b': 9}`: later keys win, and a new dict is created."

[[card]]
id = "323ecdce"
q = "Write the loop body that sums `amount` per `customer` into a dict `totals`."
a = "```python\ntotals[o[\"customer\"]] = totals.get(o[\"customer\"], 0) + o[\"amount\"]\n```"

[[card]]
id = "a24f8ae9"
q = "Why does `{[1, 2]: \"x\"}` fail, and what error do you see?"
a = "Dict keys must be hashable and lists are mutable: `TypeError: unhashable type: 'list'`. Use a tuple."

[[card]]
id = "69868777"
q = "Write a list comprehension for `SELECT * WHERE amount > 25` over `orders` (list of dicts)."
a = "```python\n[o for o in orders if o[\"amount\"] > 25]\n```"
