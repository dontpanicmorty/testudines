[[card]]
id = "42851053"
q = "`@retry(attempts=3)` has three nested functions. What does each layer receive and return?"
a = "`retry(attempts=3)` takes the options and returns a decorator; the decorator takes the function and returns a wrapper; the wrapper takes the call's `*args, **kwargs` and returns the result."

[[card]]
id = "5d576ced"
q = "Why does `retry` take a `sleep=time.sleep` parameter?"
a = "Tests inject a recording fake (`sleeps.append`) so no real waiting happens and the delays can be asserted."

[[card]]
id = "8b505ac3"
q = "What does `functools.wraps(fn)` fix on the wrapper?"
a = "It copies `__name__`, `__doc__` and other metadata so the decorated function still looks like the original."

[[card]]
id = "35adbf19"
q = "Why report all config errors in one `ConfigError` instead of raising on the first?"
a = "One run shows every missing or invalid setting, so a deploy is fixed in one attempt, not one error at a time."

[[card]]
id = "dca7f2d3"
q = "Why a `Protocol` for connections rather than a base class, and what does `@runtime_checkable` add?"
a = "Any object with the right methods qualifies (fakes, other databases) without inheriting. `runtime_checkable` allows `isinstance` to check those methods exist."

[[card]]
id = "a3c203d7"
q = "How do you wrap a `sqlite3.Error` in your own exception and keep the original?"
a = "```python\ntry:\n    ...\nexcept sqlite3.Error as exc:\n    raise DatabaseError(str(exc)) from exc\n```\nThe original is available as `__cause__`."

[[card]]
id = "556a8a45"
q = "A public-API test fails after you rename a parameter `delay` to `wait`. What is the right question to ask?"
a = "Whether you are willing to ship a breaking change (new major version). Renames break callers using the keyword; add the new name while keeping the old, or bump the major."
