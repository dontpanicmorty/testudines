[project]
name = "pydojo"
version = "0.1.0"
description = "Offline, project-based Python training for data practitioners"
requires-python = ">=3.12"
dependencies = [
  "pyside6-essentials>=6.7",  # the native desktop UI
  "pytest>=8",
  # learner toolbox: installed once so every lesson works offline afterwards
  "duckdb>=1.1",
  "polars>=1.0",
  "pandas>=3.0,<4",
  "pyarrow>=16",
  "pydantic>=2.7",
  "httpx>=0.27",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "typer>=0.12",
  "pyyaml>=6",
  "tenacity>=8.3",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
]

[project.optional-dependencies]
snowflake = ["snowflake-connector-python>=3.10"]

[project.scripts]
pydojo = "pydojo.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pydojo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
